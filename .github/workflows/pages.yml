name: Deploy Console to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

# Publishes by force-pushing src/ to the gh-pages branch, which is what
# Settings → Pages serves. This needs no `pages` permission, so it works in
# environments where the GitHub App cannot enable Pages itself.
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish src/ to gh-pages
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp -r src/. "$tmp/"
          rm -f "$tmp/console-pwa.zip"
          touch "$tmp/.nojekyll"   # keep underscore-prefixed paths served as-is
          cd "$tmp"
          git init -q
          git checkout -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages:gh-pages
